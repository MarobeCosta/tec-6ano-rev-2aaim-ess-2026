  if(it.disc){h+='<div class="l">✍️ Escreva a sua resposta.</div><textarea id="essTx" rows="7" placeholder="escreva aqui">'+esc(P.txt[it.id]||"")+'</textarea><div class="l">A dissertativa não vale nota.</div>'}
  else{const ord=ordem(it.alts.length,ESS_K+"#"+it.id);h+='<div class="alts">';ord.forEach(function(oi,pos){const sel=P.resp[it.id]===oi;h+='<button type="button" class="alt'+(sel?" sel":"")+'" data-o="'+oi+'"><span class="lt">'+LET[pos]+'</span><span class="tx">'+it.alts[oi]+'</span><span class="tk">'+(sel?"✔":"")+"</span></button>"});h+="</div>"}
  h+='<div class="msg" id="essMsg"></div></div></div></div>';
  $("palco").innerHTML=h;
  essRodape([{id:"essV",t:"← Voltar",sec:true,dis:i===0},{id:"essP",t:ult?"📤 Ver placar":"Próximo →",dis:!it.disc&&P.resp[it.id]==null}]);
  const guardaTx=function(){const t=$("essTx");if(t){const S2=essD();S2.P.txt[it.id]=t.value;grava(S2.D)}};
  const tx=$("essTx");if(tx)tx.addEventListener("input",guardaTx);
  document.querySelectorAll("#essq .nav button").forEach(function(b){b.onclick=function(){guardaTx();essQ(+b.dataset.j)}});
  document.querySelectorAll("#essq .alt").forEach(function(b){b.onclick=function(){const S2=essD();S2.P.resp[it.id]=+b.dataset.o;grava(S2.D);essQ(i,true);try{$("essP").classList.add("m7pulsa")}catch(e){}}});
  $("essV").onclick=function(){guardaTx();essQ(i-1)};
  $("essP").onclick=function(){guardaTx();if(!ult)return essQ(i+1);
    const R=essD().P.resp||{};const falta=L.filter(function(x){return!x.disc&&R[x.id]==null}).length;
    if(falta){$("essMsg").textContent="👆 Ainda falta"+(falta>1?"m ":" ")+dz(falta)+" pergunta"+(falta>1?"s":"")+". Os números sem ✔ no alto mostram quais.";return}
    if(!confirm("Ver o placar agora? Depois disso, não dá para mudar as respostas."))return;

/* ---- placar parcial (tela 17) ---- */
function essPlacar(){
  const L=provaItens(ESS_K),S=essD(),P=S.P,R=P.resp||{},T=P.txt||{},O=L.filter(function(x){return!x.disc});
  tela=L.length+2;
  let ac=0;O.forEach(function(x){if(R[x.id]===x.cert)ac++});
  const resp=O.filter(function(x){return R[x.id]!=null}).length;
  let h='<div id="essq"><div class="cxq"><div class="hd">📊 Placar parcial · 2ª AAIM</div><div class="bd">'+olaLinha();
  if(GAB_OK){
    const nota=meioPonto(ac/O.length*10);
    const fa=nota>=6?{c:"verde",t:"🟢 Farol verde: a nota é 6,00 ou mais."}:nota>=5?{c:"amarelo",t:"🟡 Farol amarelo: falta pouco para o verde (6,00)."}:{c:"vermelho",t:"🔴 Farol vermelho: reveja as questões que você errou."};
    h+='<div class="pl"><div class="big">'+dz(ac)+" <span>de "+dz(O.length)+'</span></div><div class="l">Nota das perguntas de escolha: <b>'+notaTxt(nota)+'</b></div><div class="farol '+fa.c+'">'+fa.t+'</div><div class="l">A dissertativa ainda não tem nota. É parcial.</div></div>'
  }else{
    h+='<div class="pl"><div class="big">'+dz(resp)+" <span>de "+dz(O.length)+' respondidas</span></div><div class="farol amarelo">🧪 O gabarito ainda não foi colado.</div><div class="l">A nota e o gabarito aparecem quando o professor colar as respostas.</div></div>'
  }
  h+='<h3>📋 Pergunta por pergunta</h3><div class="gab">';
  L.forEach(function(x,j){
    if(x.disc){h+='<div class="g"><div class="gh"><span class="nc">'+dz(j+1)+"</span><b>"+esc(x.tema)+' · dissertativa</b><span class="st">✍️ sem nota</span></div><div class="minhaR"><b>Sua resposta:</b><br>'+(esc(T[x.id]||"").replace(/\n/g,"<br>")||"<i>(em branco)</i>")+"</div>"+(x.esperada?'<div class="esp"><b>🔑 Resposta esperada:</b><br>'+esc(x.esperada)+"</div>":"")+"</div>";return}
    if(!GAB_OK){h+='<div class="g"><div class="gh"><span class="nc">'+dz(j+1)+"</span><b>"+esc(x.tema)+'</b><span class="st">'+(R[x.id]!=null?"✔ respondida":"⬜ em branco")+"</span></div></div>";return}
    const ord=ordem(x.alts.length,ESS_K+"#"+x.id),ok=R[x.id]===x.cert,pc=ord.indexOf(x.cert);
    h+='<div class="g '+(ok?"ok":"no")+'"><div class="gh"><span class="nc">'+dz(j+1)+"</span><b>"+esc(x.tema)+'</b><span class="st">'+(ok?"✅ acertou":"❌ errou")+'</span></div><div class="gl">✅ resposta certa: <span class="lt">'+LET[pc]+"</span> → "+x.alts[x.cert]+"</div></div>"});
  h+='</div></div></div></div>';
  $("palco").innerHTML=h;
  essRodape([{id:"essOutro",t:"← Outro estudante",sec:true},{id:"essNovo",t:"↻ Fazer de novo"}]);
  $("essOutro").onclick=function(){turma="";chamadaNum="";estudante="";tela1()};
  $("essNovo").onclick=function(){if(!confirm("Apagar as respostas e começar de novo?"))return;const S2=essD();delete S2.D[ESS_K];grava(S2.D);essQ(0)};
  pintaTopo();window.scrollTo(0,0);
}
/* ---- ao apertar Começar: vai para a tela onde o estudante parou (ou para a pergunta 01) ---- */
function essAvanca(){const S=essD();if(S.P.fim)return essPlacar();essQ(S.P.i||0)}
/* ---- na tela 01: se este aparelho já tem progresso do último estudante, oferece continuar (sem pedir tudo de novo) ---- */
function essLeProg(i0){try{const o=JSON.parse(localStorage.getItem("aaim2_sim_"+ANO+"_"+idEstudante(i0.t,i0.c,i0.n))||"null");return o&&o[ESS_K]||null}catch(e){return null}}
function essRetomadaCard(){
  const i0=leId();if(!i0||!i0.n||!$("cId"))return;
  const P=essLeProg(i0);if(!P)return;
  const temResp=Object.keys(P.resp||{}).length>0||Object.keys(P.txt||{}).some(function(k){return(P.txt[k]||"").trim()});
  if(!P.fim&&!(P.i>0)&&!temResp)return;
  const n=P.fim?17:essTelaDe(P.i||0);
  const linhas=P.fim?"<div class=\"l\">Você já viu o seu placar.</div><div class=\"l\">Ele está na tela "+dz(n)+".</div>":"<div class=\"l\">Você parou na pergunta "+dz((P.i||0)+1)+" de 15.</div><div class=\"l\">Ela está na tela "+dz(n)+".</div>";
  $("cId").insertAdjacentHTML("beforebegin",'<div class="card" id="essRet" style="--c:#6A1B9A;--bg:#F3E5F5"><h2><span class="em20">🔁</span> Você já começou</h2><div class="l">Olá, <b>'+esc(i0.n)+"</b> · "+esc(i0.t)+" · número "+esc(i0.c)+"</div>"+linhas+'<div class="retbs"><button type="button" class="btn" id="essCont">▶ Continuar na tela '+dz(n)+'</button><button type="button" class="btn sec" id="essNao">🙋 Não sou eu</button></div></div>');
  $("essCont").onclick=function(){telaCheia();turma=i0.t;chamadaNum=i0.c;estudante=i0.n;essAvanca()};
  $("essNao").onclick=function(){try{localStorage.removeItem("aaim2_id_"+ANO)}catch(e){}turma="";chamadaNum="";estudante="";tela1()};
}

/* ===== tela do estudante: identificação única (tela 1) e menu do preparatório (tela 2) ===== */
var tela=1;
const TURMA_COR={A:["#1A5FA8","#D6E6F7"],B:["#1E8449","#D5F0DF"],C:["#C2410C","#FBE3D3"],D:["#7E22CE","#EDDCF9"]};
function $(id){return document.getElementById(id)}

function guardaId(){try{localStorage.setItem("aaim2_id_"+ANO,JSON.stringify({t:turma,c:chamadaNum,n:estudante}))}catch(e){}}
function leId(){try{return JSON.parse(localStorage.getItem("aaim2_id_"+ANO)||"null")}catch(e){return null}}
function circ(n){return'<span class="nc2">'+n+"</span>"}
function pintaTopo(){let t=tela;if($("m7mo"))t=3;$("tNum").textContent="tela "+zz(t);const d=new Date;$("tHora").textContent="🕐 "+zz(d.getHours())+":"+zz(d.getMinutes());document.body.classList.toggle("av",!!$("m7aval"));document.body.classList.toggle("ov",!!($("m7aval")||$("m7mo")))}
function capa(){const rot=MODO==="ESSENCIAL"?"revisão":"preparatório";return'<div class="cap"><div class="k">'+(MODO==="ESSENCIAL"?"Revisão":"Preparatório")+' · '+ANO+'º ano · 4º bimestre</div><div class="u">UNIDADE 02: '+rot+' para a 2ª AAIM</div><div class="e">🏫 E.E. Dr. Benedicto Martins Barbosa · 👨‍🏫 professor Marcos</div></div>'}
function tela1(){tela=1;const i0=leId()||{};let t=turma||i0.t||"",c=chamadaNum||i0.c||"",n=estudante||i0.n||"";let h=capa()+'<div class="card" id="cId"><h2><span class="em20">👋</span> Quem é você?</h2><div class="l">Você diz isso uma vez só.</div>';h+='<div class="passo">'+circ(1)+"Escolha a sua turma</div><div class=\"turmas\" id=\"turmas\">"+TURMAS.map(function(L){return'<button type="button" data-t="'+L+'" style="--tc:'+TURMA_COR[L][0]+";--tl:"+TURMA_COR[L][1]+'">'+ANO+"º "+L+"</button>"}).join("")+"</div>";h+='<div class="passo">'+circ(2)+'Digite o seu número de chamada</div><input class="campo" id="inNum" type="number" inputmode="numeric" min="1" max="60" placeholder="número" value="'+esc(c)+'">';h+='<div class="passo">'+circ(3)+'Digite o seu nome completo</div><input class="campo" id="inNome" type="text" autocomplete="off" placeholder="nome e sobrenome" value="'+esc(n)+'"><div class="msg" id="msgId"></div></div>';$("palco").innerHTML=h;let sel=t.replace(/^\d+º\s*/,"").trim().slice(-1);const pinta=function(){document.querySelectorAll("#turmas button").forEach(function(b){b.classList.toggle("on",b.dataset.t===sel)});valida()};const valida=function(){const nv=parseInt($("inNum").value,10),nm=$("inNome").value.trim().replace(/\s+/g," ");const ok=!!sel&&nv>=1&&nv<=60&&nm.split(" ").length>=2&&nm.length>=5;let m="";if(!ok){if(!sel)m="👆 Escolha a turma.";else if(!(nv>=1&&nv<=60))m="👆 Digite o número de chamada, de 01 a 60.";else m="👆 Digite nome e sobrenome."}$("msgId").textContent=m;$("bAvanca").disabled=!ok;return ok};document.querySelectorAll("#turmas button").forEach(function(b){b.onclick=function(){sel=b.dataset.t;pinta()}});$("inNum").addEventListener("input",valida);$("inNome").addEventListener("input",valida);$("inNum").addEventListener("keydown",function(e){if(e.key==="Enter")$("inNome").focus()});$("inNome").addEventListener("keydown",function(e){if(e.key==="Enter"&&valida())avanca()});if(MODO==="ESSENCIAL")essRetomadaCard();rodape(1);pinta();pintaTopo()}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function telaCheia(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){})}catch(e){}}
function avanca(){telaCheia();const sel=document.querySelector("#turmas button.on");if(!sel)return;turma=ANO+"º "+sel.dataset.t;chamadaNum=String(parseInt($("inNum").value,10));estudante=$("inNome").value.trim().replace(/\s+/g," ");guardaId();if(MODO==="ESSENCIAL")essAvanca();else tela2()/* V00.02: tela2() (menu) fica para MODO=COMPLETO; desligado no essencial por ordem do MARCOS 23/11 */}
function op(o){const mk=o.est==="esc"?"✔":o.est==="abr"?"☐":"🔒";return'<button type="button" class="op '+(o.est==="esc"?"esc":o.est==="trv"?"trv":"")+'" style="--c:'+o.cor+";--bg:"+o.bg+'" data-a="'+(o.acao||"")+'"'+(o.est==="trv"?' disabled aria-disabled="true"':"")+'><span class="em">'+o.e+'</span><span class="tx"><b>'+o.n+"</b><span>"+o.d1+"</span><span>"+o.d2+'</span></span><span class="mk">'+mk+"</span></button>"}
function tela2(){tela=2;let h=capa()+'<div class="card" style="--c:#00695C;--bg:#E0F2F1"><h2><span class="em20">📝</span> Preparatório para avaliações</h2><div class="l">Aqui você treina para a 2ª AAIM.</div><div class="l">Escolha o que fazer hoje.</div></div>';h+='<div class="leg"><span>✔ escolhido</span><span>☐ aberto</span><span>🔒 trancado</span></div>';h+=op({est:"esc",e:"🎯",n:"Simulado",d1:"É um simulado sem apoio, como a prova.",d2:"No fim aparecem a nota e o gabarito.",cor:"#00838F",bg:"#E0F7FA",acao:"sim"});h+=op({est:"abr",e:"📝",n:"Avaliação de substituição",d1:"É só para quem perdeu a prova do Alura.",d2:"Abre com a senha do professor.",cor:"#455A64",bg:"#ECEFF1",acao:"aval"});h+=op({est:"trv",e:"📗",n:"Revisão da 2ª AAIM",d1:"As questões da 2ª avaliação, uma por uma.",d2:"Em breve.",cor:"#2E7D32",bg:"#E8F5E9"});h+=op({est:"trv",e:"🩹",n:"Devolutiva da 2ª AAIM",d1:"O que você errou, dentro da Revisão.",d2:"Em breve.",cor:"#E65100",bg:"#FFF3E0"});h+=op({est:"trv",e:"🛠️",n:"Retomada · desafio parte 2",d1:"Um projeto mão na massa, com contexto novo.",d2:"Em breve.",cor:"#6A1B9A",bg:"#F3E5F5"});$("palco").innerHTML=h;document.querySelectorAll(".op").forEach(function(b){if(b.dataset.a==="sim")b.onclick=function(){window.aaim2Simulado()};if(b.dataset.a==="aval")b.onclick=function(){m7AvalAbre()}});rodape(2);pintaTopo();window.scrollTo(0,0)}
function rodape(t){let h='<div class="nav">';if(t===1)h+='<button type="button" class="btn sec" disabled>← Voltar</button><button type="button" class="btn" id="bAvanca" disabled>▶ Começar</button>';else h+='<button type="button" class="btn sec" id="bVolta">← Trocar de estudante</button>';h+='</div><div class="ver">'+VERSAO+" · "+NO_PROV+" · "+DATA_VER+"</div>";$("rodape").innerHTML=h;const a=$("bAvanca");if(a)a.onclick=avanca;const v=$("bVolta");if(v)v.onclick=function(){turma="";chamadaNum="";estudante="";tela1()};medeRodape()}
function medeRodape(){try{$("palco").style.paddingBottom=($("rodape").getBoundingClientRect().height+16)+"px"}catch(e){}}
(function(){try{new ResizeObserver(medeRodape).observe($("rodape"))}catch(e){}window.addEventListener("resize",medeRodape)})();

try{new MutationObserver(anexaTopoAval).observe(document.body,{childList:true})}catch(e){}
setInterval(anexaTopoAval,300);
setInterval(pintaTopo,250);
